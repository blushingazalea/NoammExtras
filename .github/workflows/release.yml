name: Release NoammExtras JAR

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        run: ./gradlew --no-daemon clean build

      - name: Publish JAR to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar="$(find build/libs -maxdepth 1 -type f -name 'NoammExtras-*.jar' ! -name '*-sources.jar' ! -name '*-dev.jar' -print -quit)"
          test -n "$jar"
          gh release create "$GITHUB_REF_NAME" "$jar" \
            --title "NoammExtras $GITHUB_REF_NAME" \
            --generate-notes